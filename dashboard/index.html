<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHP1 Dashboard Operativo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="hero">
        <div class="hero-badge">SHP1 PACHUCA</div>
        <h1>INGENIERIA DE PLANTA</h1>
        <p>Vista unificada de Ingenieria de planta y Limpieza</p>
    </header>

    <section class="kpis" id="kpis">
        <div class="kpi">
            <span class="kpi-label">Bitacora</span>
            <span class="kpi-value" id="kpi-bitacora">-</span>
        </div>
        <div class="kpi">
            <span class="kpi-label">Limpieza</span>
            <span class="kpi-value" id="kpi-limpieza">-</span>
        </div>
        <div class="kpi">
            <span class="kpi-label">Pendientes abiertos</span>
            <span class="kpi-value" id="kpi-pendientes">-</span>
        </div>
        <div class="kpi">
            <span class="kpi-label">Materiales</span>
            <span class="kpi-value" id="kpi-materiales">-</span>
        </div>
        <div class="kpi">
            <span class="kpi-label">Proyectos</span>
            <span class="kpi-value" id="kpi-proyectos">-</span>
        </div>
    </section>

    <nav class="tabs">
        <button class="tab active" data-tab="principal">Principal</button>
        <button class="tab" data-tab="supervisor">Ingenieria de planta</button>
        <button class="tab" data-tab="limpieza">Limpieza y Asistencia</button>
    </nav>

    <section class="panel">
        <div class="filters" id="filters-wrap">
            <input id="filter-search" type="text" placeholder="Buscar..." />
            <input id="filter-from" type="datetime-local" />
            <input id="filter-to" type="datetime-local" />
            <input id="filter-area" type="text" placeholder="Area" />
            <input id="filter-extra" type="text" placeholder="Tecnico / Autor / Estado" />
            <button id="btn-aplicar">Aplicar</button>
            <button id="btn-limpiar" class="ghost">Limpiar</button>
        </div>

        <div class="subtabs" id="subtabs-supervisor" hidden>
            <button class="subtab" data-scope="bitacora">Bitacora</button>
            <button class="subtab active" data-scope="pendientes">Pendientes</button>
            <button class="subtab" data-scope="alertas">Alertas</button>
            <button class="subtab" data-scope="preventivos">Preventivos</button>
            <button class="subtab" data-scope="completados">Completados</button>
            <button class="subtab" data-scope="materiales">Materiales</button>
            <button class="subtab" data-scope="proyectos">Proyectos</button>
            <button class="subtab" data-scope="asistencia">Asistencia</button>
        </div>

        <div class="subtabs" id="subtabs-supervisor-asistencia" hidden>
            <button class="subtab supervisor-asistencia-subtab active" data-supervisor-asistencia-scope="diaria">Diaria</button>
            <button class="subtab supervisor-asistencia-subtab" data-supervisor-asistencia-scope="semanal">Semanal</button>
            <button class="subtab supervisor-asistencia-subtab" data-supervisor-asistencia-scope="mensual">Mensual</button>
        </div>

        <div class="subtabs" id="subtabs-limpieza" hidden>
            <button class="subtab active" data-limpieza-view="actividades">Actividades</button>
            <button class="subtab" data-limpieza-view="asistencia">Asistencia</button>
        </div>

        <div class="subtabs" id="subtabs-asistencia" hidden>
            <button class="asistencia-subtab active" data-asistencia-scope="diaria">Diaria</button>
            <button class="asistencia-subtab" data-asistencia-scope="semanal">Semanal</button>
            <button class="asistencia-subtab" data-asistencia-scope="marcador">Marcador</button>
        </div>

        <div id="status" class="status">Cargando...</div>
        <div id="listado" class="listado"></div>

        <div class="pagination" id="pagination-wrap">
            <button id="btn-prev" class="ghost">Anterior</button>
            <span id="page-info">-</span>
            <button id="btn-next" class="ghost">Siguiente</button>
        </div>
    </section>

    <div id="modal" class="modal" aria-hidden="true">
        <button class="modal-close" id="modal-close">x</button>
        <button class="modal-nav left" id="modal-prev">&#10094;</button>
        <img id="modal-image" class="modal-image" alt="evidencia" />
        <button class="modal-nav right" id="modal-next">&#10095;</button>
        <div id="modal-counter" class="modal-counter">1 / 1</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
