<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <header class="header">

    
    <h1>
        🔧 INGENIERIA DE PLANTA
    </h1>

    <p>
        Bitacora diaria de actividades
    </p>

</header>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SHP1 - PACHUCA</h1>

    <div id="actividades">
        Cargando actividades...
    </div>

    <script src="app.js"></script>
<!-- MODAL IMAGEN -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <span
            class="cerrar"
            onclick="cerrarModal()"
        >
            &times;
        </span>

        <button
            class="flecha izquierda"
            onclick="imagenAnterior()"
        >
            &#10094;
        </button>

        <img
            id="imagenModal"
            class="modal-contenido"
        >

        <button
            class="flecha derecha"
            onclick="imagenSiguiente()"
        >
            &#10095;
        </button>

        <div
            id="contadorImagen"
            class="contador"
        >
            1 / 1
        </div>

    </div>


</body>
</html>
